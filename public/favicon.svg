<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>
  </defs>
  <!-- Background Shield Rounded Rect -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="4" />
  <!-- Monogram BK -->
  <text x="50" y="62" font-family="'Syne', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="-1">BK</text>
  <!-- Tiny Cyber Accent Dot -->
  <circle cx="80" cy="24" r="5" fill="#3DD68C" />
</svg>
